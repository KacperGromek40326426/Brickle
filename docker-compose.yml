services:
  web:
    build: .
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - .:/var/www/html:ro
      - quiz_data:/var/lib/brickle
    environment:
      APP_TIMEZONE: ${APP_TIMEZONE:-UTC}
      APP_SECURE_COOKIES: "0"
      PRIVATE_STORAGE_PATH: /var/lib/brickle

volumes:
  quiz_data:
